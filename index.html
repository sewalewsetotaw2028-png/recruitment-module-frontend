<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/adiu-logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adiu — Recruitment Management</title>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />

    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        display: inline-block;
        vertical-align: middle;
      }
      .tonal-layer {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 1) 0%,
          rgba(248, 250, 252, 1) 100%
        );
      }
      .focused-shadow {
        box-shadow: 0 12px 40px -12px rgba(0, 0, 0, 0.1);
      }
      .card-premium {
        background: #ffffff;
        border: 1px solid #e0e3e5;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body class="bg-background text-on-surface font-body-md overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
